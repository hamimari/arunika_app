name: Merge (Android emulator integration)

# integration_test/ flows against the real backend stack, on an Android
# emulator. Runs on merges here, on demand, and when another repo dispatches
# `app-merged`. Not a PR gate: an emulator boot is slow and this proves the
# assembled system, which the PR workflow's unit/widget tests already cover
# piece by piece.
on:
  push:
    branches: [master, main]
  repository_dispatch:
    types: [app-merged]
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  emulator:
    name: Integration (Android emulator)
    # Hardware acceleration for the emulator needs KVM, present on ubuntu runners.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: arunika_app

      # The backend's docker-compose.yml builds ../arunika-backoffice, so all
      # three repos sit side by side under one workspace.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arunika-backend
          path: arunika-backend
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arunika-backoffice
          path: arunika-backoffice
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: arunika-backend/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Bring up the backend stack
        working-directory: arunika-backend
        env:
          CI: "true"
          E2E_HOLD: "1"
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          nohup go test -tags e2e ./tests/e2e/ -run TestStackHold -count=1 -timeout 60m -v > ${{ github.workspace }}/stack.log 2>&1 &
          for i in $(seq 1 120); do
            if grep -q "E2E STACK READY" ${{ github.workspace }}/stack.log; then exit 0; fi
            sleep 3
          done
          echo "stack did not become ready"; cat ${{ github.workspace }}/stack.log; exit 1

      - name: Get dependencies
        working-directory: arunika_app
        run: flutter pub get

      # Caching the AVD keeps the ~2 minute cold boot off every run after the
      # first. The key changes only when the emulator config below does.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34-x86_64-6g-v2

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          # The debug APK is ~175 MB and Patrol/integration installs stack up;
          # the default data partition filled during local runs.
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # 10.0.2.2 is the emulator's alias for the host, where compose publishes
      # the API on :8090.
      - name: Run integration flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          # The debug APK is ~175 MB and Patrol/integration installs stack up;
          # the default data partition filled during local runs.
          disk-size: 6000M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: arunika_app
          script: scripts/run_integration.sh emulator-5554 http://10.0.2.2:8090 ${{ github.workspace }}/artifacts

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-failure-evidence
          path: |
            artifacts/
            stack.log
          if-no-files-found: ignore
