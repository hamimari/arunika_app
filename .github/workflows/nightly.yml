name: Nightly (native UI)

# Patrol flows for the OS permission dialogs that integration_test cannot see
# (camera before QR scan, notifications). Nightly and on demand only — never a
# PR gate (design D3 of add-automation-testing-strategy): they boot the real
# app entrypoint and depend on emulator system dialogs that vary by image.
#
# The Play Billing check with a licence-tested account needs a real
# internal-testing build on a device signed in as a licence tester. That cannot
# run on an emulator runner and stays a manual step; see the release checklist.
on:
  schedule:
    - cron: "0 20 * * *" # 03:00 WIB
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  patrol:
    name: Patrol (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli

      - name: Get dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34-x86_64-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Patrol flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb logcat -c
            patrol test --target patrol_test/native_permissions_test.dart || { adb exec-out screencap -p > patrol-failure.png; adb logcat -d > patrol-logcat.txt; exit 1; }

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-failure-evidence
          path: |
            patrol-failure.png
            patrol-logcat.txt
          if-no-files-found: ignore
